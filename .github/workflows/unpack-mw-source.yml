name: Unpack MW Dynasty V3.2 source

on:
  push:
    paths:
      - MW_Dynasty_V3_2_Final_MW_Only_41_Week_Deploy.zip

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack final app source
        run: |
          unzip -o MW_Dynasty_V3_2_Final_MW_Only_41_Week_Deploy.zip
          rm MW_Dynasty_V3_2_Final_MW_Only_41_Week_Deploy.zip
          git config user.name "MW Dynasty Deploy"
          git config user.email "deploy@users.noreply.github.com"
          git add -A
          git commit -m "Deploy MW Dynasty V3.2 final MW-only program" || exit 0
          git push

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050403">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MW Dynasty">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/favicon.png" type="image/png">
<title>MW Dynasty</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#050403;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.role-wrap{position:fixed;inset:0;display:flex;justify-content:center;align-items:stretch;background:#050403}
.role-stage{position:relative;height:100dvh;width:min(100vw,56.25dvh);max-width:100vw;overflow:hidden;background:#050403}
.role-image{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;user-select:none;-webkit-user-drag:none;pointer-events:none}
.hotspot{position:absolute;top:55.0%;height:36.5%;border:0;background:transparent;color:transparent;cursor:pointer;z-index:5;-webkit-tap-highlight-color:transparent;border-radius:26px}.hotspot:active{background:rgba(241,198,107,.045)}
.hotspot:focus-visible{outline:3px solid rgba(247,199,104,.95);outline-offset:-3px}
#athleteChoice{left:5.1%;width:43.7%}
#coachChoice{left:51.2%;width:43.7%}
/* MW 3D/4D role entry — preserves the approved artwork while adding physical depth and response */
.role-wrap{perspective:1100px}
.role-stage{transform-style:preserve-3d;box-shadow:0 24px 80px rgba(0,0,0,.62),inset 0 1px 0 rgba(255,255,255,.035);transition:transform .22s ease,box-shadow .22s ease}
.role-stage:after{content:"";position:absolute;inset:0;z-index:3;pointer-events:none;background:radial-gradient(circle at 50% 3%,rgba(245,185,46,.07),transparent 30%),linear-gradient(180deg,rgba(255,255,255,.025),transparent 22%,rgba(0,0,0,.08));mix-blend-mode:screen}
.role-image{transform:translateZ(0);filter:contrast(1.015) saturate(1.025)}
.hotspot{transform:translateZ(24px);border:1px solid rgba(245,199,96,.13);background:linear-gradient(160deg,rgba(255,255,255,.022),rgba(0,0,0,.035));box-shadow:inset 0 1px 0 rgba(255,255,255,.055),inset 0 -10px 22px rgba(0,0,0,.10),0 8px 18px rgba(0,0,0,.15);transition:transform .15s ease,box-shadow .15s ease,border-color .15s ease,filter .15s ease}
.hotspot:before{content:"";position:absolute;inset:2px 7px auto;height:34%;border-radius:22px 22px 50% 50%;background:linear-gradient(180deg,rgba(255,255,255,.055),transparent);pointer-events:none}
.hotspot:active{transform:translateZ(10px) translateY(4px) scale(.985);border-color:rgba(245,199,96,.32);background:linear-gradient(160deg,rgba(245,199,96,.045),rgba(0,0,0,.055));box-shadow:inset 0 4px 12px rgba(0,0,0,.22),0 2px 6px rgba(0,0,0,.18)}
#athleteChoice{box-shadow:inset 0 1px 0 rgba(255,255,255,.055),inset 0 -10px 22px rgba(0,0,0,.10),0 8px 18px rgba(0,0,0,.15),0 0 22px rgba(245,185,46,.035)}
#coachChoice{box-shadow:inset 0 1px 0 rgba(255,255,255,.055),inset 0 -10px 22px rgba(0,0,0,.10),0 8px 18px rgba(0,0,0,.15),0 0 22px rgba(85,201,255,.035)}
@media (hover:hover) and (pointer:fine){.hotspot:hover{transform:translateZ(34px) translateY(-2px);border-color:rgba(245,199,96,.27);filter:brightness(1.035);box-shadow:inset 0 1px 0 rgba(255,255,255,.075),inset 0 -10px 22px rgba(0,0,0,.11),0 14px 28px rgba(0,0,0,.24),0 0 24px rgba(245,185,46,.055)}}
@media (min-width:700px){.role-stage{box-shadow:0 28px 90px rgba(0,0,0,.78),inset 0 1px 0 rgba(255,255,255,.04)}}

/* Desktop role entry: full computer portal instead of a phone-shaped portrait panel. */
.desktop-entry-copy{display:none}
@media (min-width:900px){
  html,body{overflow:hidden}
  .role-wrap{
    padding:26px;
    align-items:center;
    background:
      radial-gradient(circle at 50% 0,rgba(239,189,67,.10),transparent 34%),
      radial-gradient(circle at 8% 70%,rgba(43,126,177,.10),transparent 28%),
      #030506;
  }
  .role-stage{
    width:min(1500px,calc(100vw - 52px));
    height:min(900px,calc(100vh - 52px));
    max-width:none;
    border:1px solid rgba(239,189,67,.28);
    border-radius:28px;
    overflow:hidden;
    background:#05090c;
    box-shadow:0 34px 110px rgba(0,0,0,.72),inset 0 1px 0 rgba(255,255,255,.04);
  }
  .role-stage:before{
    content:"";
    position:absolute;
    inset:0;
    z-index:1;
    pointer-events:none;
    background:
      linear-gradient(90deg,rgba(2,6,9,.94) 0%,rgba(2,6,9,.77) 31%,rgba(2,6,9,.30) 58%,rgba(2,6,9,.68) 100%),
      linear-gradient(180deg,rgba(0,0,0,.08),rgba(0,0,0,.54));
  }
  .role-stage:after{
    z-index:2;
    background:
      radial-gradient(circle at 62% 34%,rgba(245,185,46,.12),transparent 28%),
      linear-gradient(180deg,rgba(255,255,255,.025),transparent 24%,rgba(0,0,0,.12));
  }
  .role-image{
    z-index:0;
    width:100%;
    height:100%;
    object-fit:cover;
    object-position:center 44%;
    opacity:.50;
    filter:contrast(1.04) saturate(1.04) brightness(.76);
    transform:scale(1.03);
  }
  .desktop-entry-copy{
    display:block;
    position:absolute;
    z-index:4;
    left:clamp(54px,6vw,104px);
    top:50%;
    transform:translateY(-54%);
    width:min(560px,42%);
    color:#fff;
    text-shadow:0 10px 38px rgba(0,0,0,.75);
  }
  .desktop-entry-mark{
    color:#efbd43;
    font-size:clamp(22px,2.4vw,38px);
    font-weight:1000;
    letter-spacing:.18em;
  }
  .desktop-entry-system{
    margin-top:8px;
    color:#d8c28b;
    font-size:clamp(9px,.8vw,13px);
    font-weight:900;
    letter-spacing:.22em;
  }
  .desktop-entry-copy h1{
    margin:34px 0 12px;
    font-size:clamp(46px,5vw,82px);
    line-height:.94;
    letter-spacing:-.045em;
    font-weight:1000;
  }
  .desktop-entry-copy h1 span{color:#efbd43}
  .desktop-entry-copy p{
    margin:0;
    color:#e7e4dc;
    font-size:clamp(11px,1vw,16px);
    line-height:1.6;
    letter-spacing:.10em;
    font-weight:750;
  }
  .desktop-entry-copy .desktop-accent{
    width:74px;
    height:5px;
    margin:24px 0 18px;
    border-radius:999px;
    background:linear-gradient(90deg,#b77a16,#f4cf6a);
    box-shadow:0 0 22px rgba(239,189,67,.25);
  }

  .hotspot{
    top:auto;
    bottom:clamp(54px,7vh,92px);
    height:clamp(176px,24vh,232px);
    width:min(250px,18vw);
    color:#fff;
    border:1px solid rgba(239,189,67,.50);
    border-radius:20px;
    background:linear-gradient(160deg,rgba(16,27,34,.93),rgba(4,9,13,.97));
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.08),
      inset 0 -18px 28px rgba(0,0,0,.20),
      0 20px 44px rgba(0,0,0,.38),
      0 0 28px rgba(239,189,67,.06);
    display:flex;
    align-items:flex-end;
    justify-content:center;
    padding:0 18px 29px;
    font-size:clamp(18px,1.55vw,25px);
    font-weight:1000;
    line-height:1;
    letter-spacing:-.02em;
    text-transform:uppercase;
    transform:translateZ(24px);
  }
  .hotspot:before{
    inset:18px 18px auto;
    height:62%;
    border-radius:14px;
    background:
      radial-gradient(circle at 50% 36%,rgba(239,189,67,.18),transparent 34%),
      linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.01));
    border:1px solid rgba(255,255,255,.055);
  }
  .hotspot:after{
    position:absolute;
    left:18px;
    right:18px;
    bottom:12px;
    text-align:center;
    color:#bfc7cb;
    font-size:9px;
    font-weight:850;
    letter-spacing:.12em;
  }
  #athleteChoice{
    left:auto;
    right:clamp(314px,23vw,390px);
  }
  #coachChoice{
    left:auto;
    right:clamp(44px,5vw,84px);
  }
  #athleteChoice:after{content:"TRAIN • IMPROVE • COMPETE"}
  #coachChoice:after{content:"LEAD • DEVELOP • BUILD"}

  @media (hover:hover) and (pointer:fine){
    .hotspot:hover{
      transform:translateZ(36px) translateY(-7px) scale(1.025);
      border-color:rgba(247,207,105,.82);
      filter:brightness(1.08);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.12),
        inset 0 -18px 28px rgba(0,0,0,.18),
        0 28px 54px rgba(0,0,0,.46),
        0 0 34px rgba(239,189,67,.12);
    }
  }
}
@media (min-width:1400px){
  #athleteChoice{right:360px}
  #coachChoice{right:76px}
}
@media (prefers-reduced-motion:reduce){.role-stage,.hotspot{transition:none!important}}
</style>
<link rel="stylesheet" href="/assets/mw-unified-theme.css">
<link rel="stylesheet" href="/assets/mw-dynasty-luxe-v21.css">
<link rel="stylesheet" href="/assets/mw-responsive-v25.css">
</head>
<body>
<div class="role-wrap">
  <main class="role-stage" aria-label="Choose how you use MW Dynasty">
    <img class="role-image" src="/assets/mw-role-entry-v21.jpg" alt="MW Dynasty role selection">
    <div class="desktop-entry-copy" aria-hidden="true">
      <div class="desktop-entry-mark">MW DYNASTY</div>
      <div class="desktop-entry-system">SPRINT PERFORMANCE SYSTEM</div>
      <h1>HOW WILL YOU USE <span>MW DYNASTY?</span></h1>
      <div class="desktop-accent"></div>
      <p>FASTER ATHLETES • STRONGER PEOPLE • BRIGHTER FUTURES</p>
    </div>
    <button id="athleteChoice" class="hotspot" aria-label="I'm an Athlete">I'm an Athlete</button>
    <button id="coachChoice" class="hotspot" aria-label="I'm a Coach">I'm a Coach</button>
  </main>
</div>
<script>
function enter(role,path){
  try{ localStorage.setItem('mwDynastyRoleChoice',role); }catch(e){}
  window.location.assign(path);
}
document.getElementById('athleteChoice').addEventListener('click',()=>enter('athlete','/athlete/'));
document.getElementById('coachChoice').addEventListener('click',()=>enter('coach','/coach'));
const stage=document.querySelector('.role-stage');
if(stage&&window.matchMedia('(hover:hover) and (pointer:fine)').matches&&!window.matchMedia('(prefers-reduced-motion:reduce)').matches){
  stage.addEventListener('pointermove',e=>{const r=stage.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;stage.style.transform=`rotateY(${(x*2.4).toFixed(2)}deg) rotateX(${(-y*1.8).toFixed(2)}deg) translateZ(0)`});
  stage.addEventListener('pointerleave',()=>{stage.style.transform='rotateY(0deg) rotateX(0deg) translateZ(0)'});
}
</script>
</body>
</html>

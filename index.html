<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050403">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MW Dynasty">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/favicon.png" type="image/png">
<title>MW Dynasty</title>
<script>
if (window.location.hostname === 'founder.mwdynasty.com' && window.location.pathname === '/') {
  window.location.replace('/founder/' + window.location.search + window.location.hash);
}
</script>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#050403;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.role-wrap{position:fixed;inset:0;display:flex;justify-content:center;align-items:stretch;background:#050403}
.role-stage{position:relative;height:100dvh;width:min(100vw,56.25dvh);max-width:100vw;overflow:hidden;background:#050403}
.role-image{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;user-select:none;-webkit-user-drag:none;pointer-events:none}
.hotspot{position:absolute;top:55.0%;height:36.5%;border:0;background:transparent;color:transparent;cursor:pointer;z-index:5;-webkit-tap-highlight-color:transparent;border-radius:26px}.hotspot:active{background:rgba(241,198,107,.045)}
.hotspot:focus-visible{outline:3px solid rgba(247,199,104,.95);outline-offset:-3px}
#athleteChoice{left:5.1%;width:43.7%}
#coachChoice{left:51.2%;width:43.7%}
/* MW 3D/4D role entry — preserves the approved artwork while adding physical depth and response */
.role-wrap{perspective:1100px}
.role-stage{transform-style:preserve-3d;box-shadow:0 24px 80px rgba(0,0,0,.62),inset 0 1px 0 rgba(255,255,255,.035);transition:transform .22s ease,box-shadow .22s ease}
.role-stage:after{content:"";position:absolute;inset:0;z-index:3;pointer-events:none;background:radial-gradient(circle at 50% 3%,rgba(245,185,46,.07),transparent 30%),linear-gradient(180deg,rgba(255,255,255,.025),transparent 22%,rgba(0,0,0,.08));mix-blend-mode:screen}
.role-image{transform:translateZ(0);filter:contrast(1.015) saturate(1.025)}
.hotspot{transform:translateZ(24px);border:1px solid rgba(245,199,96,.13);background:linear-gradient(160deg,rgba(255,255,255,.022),rgba(0,0,0,.035));box-shadow:inset 0 1px 0 rgba(255,255,255,.055),inset 0 -10px 22px rgba(0,0,0,.10),0 8px 18px rgba(0,0,0,.15);transition:transform .15s ease,box-shadow .15s ease,border-color .15s ease,filter .15s ease}
.hotspot:before{content:"";position:absolute;inset:2px 7px auto;height:34%;border-radius:22px 22px 50% 50%;background:linear-gradient(180deg,rgba(255,255,255,.055),transparent);pointer-events:none}
.hotspot:active{transform:translateZ(10px) translateY(4px) scale(.985);border-color:rgba(245,199,96,.32);background:linear-gradient(160deg,rgba(245,199,96,.045),rgba(0,0,0,.055));box-shadow:inset 0 4px 12px rgba(0,0,0,.22),0 2px 6px rgba(0,0,0,.18)}
#athleteChoice{box-shadow:inset 0 1px 0 rgba(255,255,255,.055),inset 0 -10px 22px rgba(0,0,0,.10),0 8px 18px rgba(0,0,0,.15),0 0 22px rgba(245,185,46,.035)}
#coachChoice{box-shadow:inset 0 1px 0 rgba(255,255,255,.055),inset 0 -10px 22px rgba(0,0,0,.10),0 8px 18px rgba(0,0,0,.15),0 0 22px rgba(85,201,255,.035)}
@media (hover:hover) and (pointer:fine){.hotspot:hover{transform:translateZ(34px) translateY(-2px);border-color:rgba(245,199,96,.27);filter:brightness(1.035);box-shadow:inset 0 1px 0 rgba(255,255,255,.075),inset 0 -10px 22px rgba(0,0,0,.11),0 14px 28px rgba(0,0,0,.24),0 0 24px rgba(245,185,46,.055)}}
@media (min-width:700px){.role-stage{box-shadow:0 28px 90px rgba(0,0,0,.78),inset 0 1px 0 rgba(255,255,255,.04)}}
/* Desktop role entry: use the full laptop/desktop canvas. Mobile keeps the approved portrait selector. */
.desktop-entry{display:none}
@media (min-width:900px){
  .role-wrap{
    align-items:center;
    padding:32px;
    background:
      radial-gradient(circle at 18% 18%,rgba(239,189,67,.11),transparent 28%),
      radial-gradient(circle at 82% 78%,rgba(40,123,176,.14),transparent 34%),
      linear-gradient(135deg,#020507,#071019 58%,#020507);
  }
  .role-stage{
    width:min(1500px,calc(100vw - 64px));
    height:min(900px,calc(100dvh - 64px));
    max-width:none;
    align-self:center;
    border-radius:30px;
    border:1px solid rgba(239,189,67,.25);
    background:
      radial-gradient(circle at 76% 18%,rgba(239,189,67,.10),transparent 24%),
      linear-gradient(135deg,rgba(8,16,22,.98),rgba(2,6,10,.99));
    box-shadow:0 34px 110px rgba(0,0,0,.72),inset 0 1px 0 rgba(255,255,255,.045);
  }
  .role-stage:after{
    background:
      linear-gradient(90deg,rgba(255,255,255,.018),transparent 40%),
      radial-gradient(circle at 75% 28%,rgba(239,189,67,.08),transparent 30%);
  }
  .role-image,.hotspot{display:none}
  .desktop-entry{
    position:relative;
    z-index:6;
    display:grid;
    grid-template-columns:minmax(0,1.08fr) minmax(420px,.92fr);
    gap:clamp(42px,6vw,100px);
    align-items:center;
    width:100%;
    height:100%;
    padding:clamp(52px,7vw,104px);
    color:#fff;
  }
  .desktop-copy{max-width:690px}
  .desktop-kicker{
    color:#efbd43;
    font-size:clamp(12px,.85vw,15px);
    font-weight:900;
    letter-spacing:.24em;
  }
  .desktop-entry h1{
    margin:18px 0 20px;
    max-width:760px;
    font-size:clamp(50px,5.2vw,86px);
    line-height:.94;
    letter-spacing:-.05em;
    font-weight:1000;
  }
  .desktop-entry h1 span{color:#efbd43}
  .desktop-entry p{
    margin:0;
    max-width:630px;
    color:#cbd3d9;
    font-size:clamp(17px,1.35vw,22px);
    line-height:1.55;
  }
  .desktop-accent{
    width:86px;
    height:5px;
    margin:28px 0 24px;
    border-radius:999px;
    background:linear-gradient(90deg,#b77a16,#f4cf6a);
    box-shadow:0 0 26px rgba(239,189,67,.22);
  }
  .desktop-choices{
    display:grid;
    gap:18px;
    width:100%;
    max-width:520px;
    justify-self:end;
  }
  .desktop-choice{
    position:relative;
    width:100%;
    min-height:168px;
    padding:30px 32px;
    text-align:left;
    border:1px solid rgba(239,189,67,.38);
    border-radius:22px;
    background:linear-gradient(155deg,rgba(20,31,39,.96),rgba(5,10,14,.98));
    color:#fff;
    cursor:pointer;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 20px 44px rgba(0,0,0,.28);
    transition:transform .18s ease,border-color .18s ease,box-shadow .18s ease,filter .18s ease;
  }
  .desktop-choice strong{
    display:block;
    font-size:clamp(26px,2vw,34px);
    line-height:1;
    letter-spacing:-.025em;
  }
  .desktop-choice span{
    display:block;
    margin-top:12px;
    color:#e6c56f;
    font-size:14px;
    font-weight:800;
    letter-spacing:.07em;
    text-transform:uppercase;
  }
  .desktop-choice small{
    display:block;
    margin-top:14px;
    color:#aeb8bf;
    font-size:14px;
    line-height:1.45;
  }
  .desktop-choice:after{
    content:"→";
    position:absolute;
    right:30px;
    top:28px;
    color:#efbd43;
    font-size:30px;
    font-weight:900;
  }
  .desktop-choice:focus-visible{outline:3px solid rgba(247,199,104,.95);outline-offset:4px}
  @media (hover:hover) and (pointer:fine){
    .desktop-choice:hover{
      transform:translateY(-5px);
      border-color:rgba(247,207,105,.78);
      filter:brightness(1.07);
      box-shadow:inset 0 1px 0 rgba(255,255,255,.09),0 28px 54px rgba(0,0,0,.38),0 0 30px rgba(239,189,67,.07);
    }
  }
}
@media (min-width:900px) and (max-width:1100px){
  .desktop-entry{grid-template-columns:1fr 420px;gap:38px;padding:46px}
  .desktop-entry h1{font-size:clamp(44px,5vw,62px)}
}
@media (prefers-reduced-motion:reduce){.role-stage,.hotspot{transition:none!important}}
</style>
<link rel="stylesheet" href="/assets/mw-unified-theme.css">
<link rel="stylesheet" href="/assets/mw-dynasty-luxe-v21.css">
<link rel="stylesheet" href="/assets/mw-responsive-v25.css">
<script src="/lib/mw-resilience.js"></script><script src="/assets/mw-web-analytics.js"></script>\n</head>
<body>
<div class="role-wrap">
  <main class="role-stage" aria-label="Choose how you use MW Dynasty">
    <img class="role-image" src="/assets/mw-role-entry-v21.jpg" alt="MW Dynasty role selection">
    <button id="athleteChoice" class="hotspot" aria-label="I'm an Athlete">I'm an Athlete</button>
    <button id="coachChoice" class="hotspot" aria-label="I'm a Coach">I'm a Coach</button>
    <section class="desktop-entry" aria-label="Choose your MW Dynasty experience">
      <div class="desktop-copy">
        <div class="desktop-kicker">MW DYNASTY · SPRINT PERFORMANCE SYSTEM</div>
        <h1>CHOOSE YOUR <span>MW DYNASTY</span> EXPERIENCE.</h1>
        <div class="desktop-accent"></div>
        <p>Train, coach, and manage your MW Dynasty experience from a layout built for a full computer screen.</p>
      </div>
      <div class="desktop-choices">
        <button id="athleteDesktop" class="desktop-choice" type="button">
          <strong>I'M AN ATHLETE</strong>
          <span>Enter Athlete Experience</span>
          <small>Create or access your athlete profile, training, program, performance tools, and Coach MW.</small>
        </button>
        <button id="coachDesktop" class="desktop-choice" type="button">
          <strong>I'M A COACH</strong>
          <span>Enter Coach Experience</span>
          <small>Sign in to your coach dashboard, teams, athlete oversight, practice tools, messaging, and Coach MW.</small>
        </button>
      </div>
    </section>
  </main>
</div>
<script>
const MW_NATIVE_APP=/MWDynasty-iOS\//i.test(navigator.userAgent||'');
function enter(role,path){
  try{ localStorage.setItem('mwDynastyRoleChoice',role); }catch(e){}
  try{ window.MWWebAnalytics?.track('role_choice',{audience:role,metadata:{destination:path}}); }catch(e){}
  const destination=MW_NATIVE_APP?(role==='coach'?'/coach/':'/athlete/'):path;
  setTimeout(()=>window.location.assign(destination),60);
}
document.getElementById('athleteChoice').addEventListener('click',()=>enter('athlete','/athlete/start.html'));
document.getElementById('coachChoice').addEventListener('click',()=>enter('coach','/coach/start.html'));
document.getElementById('athleteDesktop')?.addEventListener('click',()=>enter('athlete','/athlete/start.html'));
document.getElementById('coachDesktop')?.addEventListener('click',()=>enter('coach','/coach/start.html'));
const stage=document.querySelector('.role-stage');
if(stage&&!window.matchMedia('(min-width:900px)').matches&&window.matchMedia('(hover:hover) and (pointer:fine)').matches&&!window.matchMedia('(prefers-reduced-motion:reduce)').matches){
  stage.addEventListener('pointermove',e=>{const r=stage.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;stage.style.transform=`rotateY(${(x*2.4).toFixed(2)}deg) rotateX(${(-y*1.8).toFixed(2)}deg) translateZ(0)`});
  stage.addEventListener('pointerleave',()=>{stage.style.transform='rotateY(0deg) rotateX(0deg) translateZ(0)'});
}
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050403">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MW Dynasty">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/favicon.png" type="image/png">
<title>MW Dynasty</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#050403;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.role-wrap{position:fixed;inset:0;display:flex;justify-content:center;align-items:stretch;background:#050403}
.role-stage{position:relative;height:100dvh;width:min(100vw,56.25dvh);max-width:100vw;overflow:hidden;background:#050403}
.role-image{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;user-select:none;-webkit-user-drag:none;pointer-events:none}
.hotspot{position:absolute;top:55.0%;height:36.5%;border:0;background:transparent;color:transparent;cursor:pointer;z-index:5;-webkit-tap-highlight-color:transparent;border-radius:26px}.hotspot:active{background:rgba(241,198,107,.045)}
.hotspot:focus-visible{outline:3px solid rgba(247,199,104,.95);outline-offset:-3px}
#athleteChoice{left:5.1%;width:43.7%}
#coachChoice{left:51.2%;width:43.7%}
/* MW 3D/4D role entry — preserves the approved artwork while adding physical depth and response */
.role-wrap{perspective:1100px}
.role-stage{transform-style:preserve-3d;box-shadow:0 24px 80px rgba(0,0,0,.62),inset 0 1px 0 rgba(255,255,255,.035);transition:transform .22s ease,box-shadow .22s ease}
.role-stage:after{content:"";position:absolute;inset:0;z-index:3;pointer-events:none;background:radial-gradient(circle at 50% 3%,rgba(245,185,46,.07),transparent 30%),linear-gradient(180deg,rgba(255,255,255,.025),transparent 22%,rgba(0,0,0,.08));mix-blend-mode:screen}
.role-image{transform:translateZ(0);filter:contrast(1.015) saturate(1.025)}
.hotspot{transform:translateZ(24px);border:1px solid rgba(245,199,96,.13);background:linear-gradient(160deg,rgba(255,255,255,.022),rgba(0,0,0,.035));box-shadow:inset 0 1px 0 rgba(255,255,255,.055),inset 0 -10px 22px rgba(0,0,0,.10),0 8px 18px rgba(0,0,0,.15);transition:transform .15s ease,box-shadow .15s ease,border-color .15s ease,filter .15s ease}
.hotspot:before{content:"";position:absolute;inset:2px 7px auto;height:34%;border-radius:22px 22px 50% 50%;background:linear-gradient(180deg,rgba(255,255,255,.055),transparent);pointer-events:none}
.hotspot:active{transform:translateZ(10px) translateY(4px) scale(.985);border-color:rgba(245,199,96,.32);background:linear-gradient(160deg,rgba(245,199,96,.045),rgba(0,0,0,.055));box-shadow:inset 0 4px 12px rgba(0,0,0,.22),0 2px 6px rgba(0,0,0,.18)}
#athleteChoice{box-shadow:inset 0 1px 0 rgba(255,255,255,.055),inset 0 -10px 22px rgba(0,0,0,.10),0 8px 18px rgba(0,0,0,.15),0 0 22px rgba(245,185,46,.035)}
#coachChoice{box-shadow:inset 0 1px 0 rgba(255,255,255,.055),inset 0 -10px 22px rgba(0,0,0,.10),0 8px 18px rgba(0,0,0,.15),0 0 22px rgba(85,201,255,.035)}
@media (hover:hover) and (pointer:fine){.hotspot:hover{transform:translateZ(34px) translateY(-2px);border-color:rgba(245,199,96,.27);filter:brightness(1.035);box-shadow:inset 0 1px 0 rgba(255,255,255,.075),inset 0 -10px 22px rgba(0,0,0,.11),0 14px 28px rgba(0,0,0,.24),0 0 24px rgba(245,185,46,.055)}}
@media (min-width:700px){.role-stage{box-shadow:0 28px 90px rgba(0,0,0,.78),inset 0 1px 0 rgba(255,255,255,.04)}}
/* Desktop is a true web entry screen, not a tall phone layout centered on a laptop. */
.desktop-entry{display:none}
@media (min-width:700px){
  .role-wrap{background:#02070d}
  .role-stage{width:100vw;max-width:none;background:linear-gradient(90deg,rgba(1,5,10,.78),rgba(2,8,14,.18)),url('/assets/mw-stadium-athlete-coach-v22.jpg') center/cover;box-shadow:none}
  .role-stage:after{background:linear-gradient(90deg,rgba(0,0,0,.72),rgba(0,0,0,.18)),radial-gradient(circle at 78% 26%,rgba(233,177,60,.18),transparent 32%)}
  .role-image,.hotspot{display:none}
  .desktop-entry{position:relative;z-index:6;display:flex;height:100%;max-width:1240px;margin:auto;padding:clamp(64px,9vh,118px) clamp(34px,6vw,88px);flex-direction:column;justify-content:flex-start;color:#fff}
  .desktop-kicker{font-size:12px;letter-spacing:.22em;color:#dfb154;font-weight:800}
  .desktop-entry h1{font-size:clamp(46px,6vw,84px);line-height:.96;max-width:700px;margin:18px 0;font-family:Georgia,serif;letter-spacing:-.04em}
  .desktop-entry p{font-size:clamp(18px,2vw,24px);line-height:1.45;color:#d6dde5;max-width:620px;margin:0 0 30px}
  .desktop-choices{display:flex;gap:16px;flex-wrap:wrap;margin-top:32px}
  .desktop-choice{width:min(310px,42vw);text-align:left;padding:23px 25px;border:1px solid rgba(237,194,102,.6);background:rgba(4,12,21,.7);color:#fff;cursor:pointer;border-radius:12px;transition:transform .18s ease,background .18s ease}
  .desktop-choice:hover{transform:translateY(-4px);background:rgba(24,37,50,.86)}
  .desktop-choice strong{display:block;font-size:23px;letter-spacing:.06em}.desktop-choice span{display:block;color:#e4c16b;margin-top:8px;font-size:14px}
}
@media (prefers-reduced-motion:reduce){.role-stage,.hotspot{transition:none!important}}
</style>
<link rel="stylesheet" href="/assets/mw-unified-theme.css">
<link rel="stylesheet" href="/assets/mw-dynasty-luxe-v21.css">
<link rel="stylesheet" href="/assets/mw-responsive-v25.css">
</head>
<body>
<div class="role-wrap">
  <main class="role-stage" aria-label="Choose how you use MW Dynasty">
    <img class="role-image" src="/assets/mw-role-entry-v21.jpg" alt="MW Dynasty role selection">
    <button id="athleteChoice" class="hotspot" aria-label="I'm an Athlete">I'm an Athlete</button>
    <button id="coachChoice" class="hotspot" aria-label="I'm a Coach">I'm a Coach</button>
    <section class="desktop-entry" aria-label="MW Dynasty desktop entry">
      <div class="desktop-kicker">MW DYNASTY · SPRINT PERFORMANCE</div>
      <h1>Train with purpose.<br>Lead with precision.</h1>
      <p>Choose your MW Dynasty experience to create your profile, manage your program, and sign in securely from any computer.</p>
      <div class="desktop-choices">
        <button id="athleteDesktop" class="desktop-choice"><strong>I'M AN ATHLETE</strong><span>Create profile · Train · Compete →</span></button>
        <button id="coachDesktop" class="desktop-choice"><strong>I'M A COACH</strong><span>Sign in · Lead · Build →</span></button>
        <button id="memberDesktop" class="desktop-choice"><strong>MEMBER SIGN IN</strong><span>Open your athlete account →</span></button>
      </div>
    </section>
  </main>
</div>
<script>
function enter(role,path){
  try{ localStorage.setItem('mwDynastyRoleChoice',role); }catch(e){}
  window.location.assign(path);
}
document.getElementById('athleteChoice').addEventListener('click',()=>enter('athlete','/athlete/signup.html?plan=mw_athlete'));
document.getElementById('coachChoice').addEventListener('click',()=>enter('coach','/coach'));
document.getElementById('athleteDesktop').addEventListener('click',()=>enter('athlete','/athlete/signup.html?plan=mw_athlete'));
document.getElementById('coachDesktop').addEventListener('click',()=>enter('coach','/coach'));
document.getElementById('memberDesktop').addEventListener('click',()=>enter('athlete','/athlete/'));
const stage=document.querySelector('.role-stage');
if(stage&&window.matchMedia('(hover:hover) and (pointer:fine)').matches&&!window.matchMedia('(prefers-reduced-motion:reduce)').matches){
  stage.addEventListener('pointermove',e=>{const r=stage.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;stage.style.transform=`rotateY(${(x*2.4).toFixed(2)}deg) rotateX(${(-y*1.8).toFixed(2)}deg) translateZ(0)`});
  stage.addEventListener('pointerleave',()=>{stage.style.transform='rotateY(0deg) rotateX(0deg) translateZ(0)'});
}
</script>
</body>
</html>

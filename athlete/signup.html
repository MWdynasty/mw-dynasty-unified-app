:root{--gold:#efbd43;--blue:#159cff;--muted:#9aa7b1}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 12%,#0c2538 0,transparent 38%),linear-gradient(#02070b,#010405);color:white;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:max(18px,env(safe-area-inset-top)) 16px max(24px,env(safe-area-inset-bottom))}.wrap{width:min(470px,100%);margin:auto}.back{border:1px solid #2d4353;background:#07131d;color:#dce8f0;border-radius:999px;padding:10px 14px;font-weight:800}.brand{text-align:center;margin:28px 0 22px}.brand h1{margin:14px 0 4px;font-size:30px}.brand p{margin:0;color:var(--muted)}.card{border:1px solid rgba(239,189,67,.55);border-radius:22px;background:linear-gradient(155deg,rgba(8,18,27,.98),rgba(3,8,12,.99));padding:22px;box-shadow:0 30px 80px rgba(0,0,0,.48)}label{display:block;margin:13px 0;color:#c6d0d7;font-size:11px;font-weight:800;letter-spacing:.06em}input{display:block;margin-top:7px;width:100%;height:54px;border:1px solid #315064;border-radius:11px;background:#071923;color:white;padding:0 14px;font-size:16px;outline:none}input:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(239,189,67,.09)}.check{display:flex;gap:10px;align-items:flex-start;margin:16px 0;color:#bac5cd;font-size:11px;line-height:1.45}.check input{width:18px;height:18px;margin:0;accent-color:var(--gold)}a{color:#60c7ff}.submit{width:100%;height:56px;border:1px solid #f5d37a;border-radius:11px;background:linear-gradient(100deg,#c78a1b,#f4cf68,#d79a26);color:#090909;font-size:16px;font-weight:950}.status{min-height:22px;text-align:center;margin-top:12px;color:#72d3ff;font-size:12px;line-height:1.45}.status.err{color:#ff9cab}.signin{text-align:center;margin-top:18px;color:#aab5bd;font-size:12px}.signin a{font-weight:900}.small{text-align:center;color:#78858e;font-size:10px;margin-top:12px}

</head><body><div class="wrap"><button class="back" onclick="location.href='/athlete/'">← Athlete Sign In</button><div class="brand"><div style="font-size:13px;font-weight:900;letter-spacing:.34em;color:#efbd43;margin-bottom:10px">MW DYNASTY</div><h1>Athlete Signup</h1><p>Your MW Dynasty athlete experience starts here.</p></div><section class="card"><label>FIRST NAME<input id="first" autocomplete="given-name" maxlength="80" placeholder="First name"></label><label>LAST NAME<input id="last" autocomplete="family-name" maxlength="80" placeholder="Last name"></label><label>DATE OF BIRTH<input id="dob" type="date" autocomplete="bday"></label><label>EMAIL<input id="email" type="email" autocomplete="email" placeholder="you@example.com"></label><label>PASSWORD<input id="password" type="password" autocomplete="new-password" placeholder="At least 8 characters"></label><label>CONFIRM PASSWORD<input id="confirm" type="password" autocomplete="new-password" placeholder="Confirm password"></label><label class="check"><input id="terms" type="checkbox"><span>I confirm I am at least 13 years old and agree to the <a href="/terms.html" target="_blank">Terms</a> and <a href="/privacy.html" target="_blank">Privacy Policy</a>.</span></label><button id="create" class="submit">Create Athlete Account →</button><div id="status" class="status"></div></section><div class="signin">Already have an athlete account? <a href="/athlete/">Sign In</a></div><div class="small">MW Dynasty · Athlete</div></div>
<script>
const SUPABASE_URL='https://keqgunlfwhjgcsurynef.supabase.co';
const SUPABASE_KEY='sb_publishable_JWCLQzrdWA_ZmvbpV5urVg_rcT6NECm';
const status=document.getElementById('status'),btn=document.getElementById('create'),dobInput=document.getElementById('dob');
function msg(t,e=false){status.textContent=t;status.className='status'+(e?' err':'')}
function maxEligibleDob(){const d=new Date();d.setFullYear(d.getFullYear()-13);return d.toISOString().slice(0,10)}
function ageAtLeast13(value){if(!value)return false;const dob=new Date(value+'T00:00:00');if(Number.isNaN(dob.getTime()))return false;const today=new Date();let age=today.getFullYear()-dob.getFullYear();const m=today.getMonth()-dob.getMonth();if(m<0||(m===0&&today.getDate()<dob.getDate()))age--;return age>=13}
dobInput.max=maxEligibleDob();
btn.onclick=async()=>{const first=document.getElementById('first').value.trim(),last=document.getElementById('last').value.trim(),dob=dobInput.value,email=document.getElementById('email').value.trim().toLowerCase(),password=document.getElementById('password').value,confirm=document.getElementById('confirm').value;if(!first||!last||!dob||!email||!password)return msg('Complete your first name, last name, date of birth, email, and password.',true);if(!ageAtLeast13(dob))return msg('MW Dynasty athlete accounts require age 13 or older.',true);if(password.length<8)return msg('Use at least 8 characters for your password.',true);if(password!==confirm)return msg('The passwords do not match.',true);if(!document.getElementById('terms').checked)return msg('Please confirm eligibility and accept the Terms and Privacy Policy.',true);btn.disabled=true;btn.textContent='Creating Account…';msg('Creating your MW Athlete account…');try{const u=SUPABASE_URL+'/auth/v1/signup?redirect_to='+encodeURIComponent(location.origin+'/athlete/');const r=await fetch(u,{method:'POST',headers:{apikey:SUPABASE_KEY,'Content-Type':'application/json'},body:JSON.stringify({email,password,data:{first_name:first,last_name:last,date_of_birth:dob}})});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.msg||d.error_description||d.message||'Account could not be created.');if(d.access_token){localStorage.setItem('mwSupabaseSession',JSON.stringify(d));msg('Account created. Opening MW Athlete…');setTimeout(()=>location.href='/athlete/',700)}else{msg('Account created. Check your email to confirm your address, then sign in.');btn.textContent='Account Created ✓'}}catch(e){msg(e.message||'Account could not be created.',true);btn.disabled=false;btn.textContent='Create Athlete Account →'}};
</script>

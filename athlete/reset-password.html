<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Create New Password | MW Dynasty</title>
<style>
:root{color-scheme:dark;--gold:#efbd43;--blue:#55c9ff}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#02070b;color:#f7f8f9;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 50% 15%,#102330 0,#061018 35%,#02070b 72%)}
.card{width:min(440px,100%);border:1px solid rgba(239,189,67,.42);border-radius:24px;padding:30px 24px;background:rgba(4,11,16,.96);box-shadow:0 28px 80px rgba(0,0,0,.55),0 0 40px rgba(239,189,67,.08)}
.brand{text-align:center;color:var(--gold);font-size:13px;font-weight:950;letter-spacing:.2em}.sub{text-align:center;color:#8997a2;font-size:9px;font-weight:800;letter-spacing:.18em;margin-top:6px}
h1{text-align:center;font-size:30px;margin:25px 0 7px}.lead{text-align:center;color:#b7c2cb;font-size:13px;line-height:1.5;margin:0 0 22px}
.field{margin-top:12px}label{display:block;color:#d8dee3;font-size:10px;font-weight:850;letter-spacing:.08em;margin:0 0 7px 3px}
input{width:100%;border:1px solid #31414c;border-radius:12px;background:#071119;color:white;padding:15px 14px;font-size:16px;outline:none}input:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(239,189,67,.08)}
button{width:100%;margin-top:18px;border:0;border-radius:12px;padding:15px;background:linear-gradient(110deg,#ffe18a,#d99a21 62%,#a86a0e);color:#111;font-weight:950;font-size:14px}button:disabled{opacity:.55}
.status{min-height:42px;margin-top:14px;text-align:center;color:var(--blue);font-size:12px;line-height:1.45}.status.err{color:#ff8797}.back{display:block;text-align:center;margin-top:10px;color:var(--gold);font-size:11px;font-weight:850;text-decoration:none}
</style>
</head>
<body>
<section class="card" aria-labelledby="title">
<div class="brand">MW DYNASTY</div><div class="sub">ATHLETE ACCOUNT RECOVERY</div>
<h1 id="title">Create New Password</h1>
<p class="lead">Choose a new password for your MW Dynasty athlete account.</p>
<div id="form">
<div class="field"><label for="password">NEW PASSWORD</label><input id="password" type="password" autocomplete="new-password" placeholder="At least 8 characters"></div>
<div class="field"><label for="confirm">CONFIRM NEW PASSWORD</label><input id="confirm" type="password" autocomplete="new-password" placeholder="Enter it again"></div>
<button id="save" type="button">SAVE NEW PASSWORD</button>
</div>
<div id="status" class="status" role="status" aria-live="polite"></div>
<a class="back" href="/athlete/">BACK TO ATHLETE SIGN IN</a>
</section>
<script>
const SUPABASE_URL='https://keqgunlfwhjgcsurynef.supabase.co';
const SUPABASE_KEY='sb_publishable_JWCLQzrdWA_ZmvbpV5urVg_rcT6NECm';
const statusEl=document.getElementById('status'),form=document.getElementById('form'),save=document.getElementById('save');
function status(msg,err=false){statusEl.textContent=msg;statusEl.classList.toggle('err',err)}
function recovery(){
 const h=new URLSearchParams(location.hash.replace(/^#/,''));
 const q=new URLSearchParams(location.search);
 return {type:h.get('type')||q.get('type')||'',token:h.get('access_token')||q.get('access_token')||'',error:h.get('error')||q.get('error')||'',description:h.get('error_description')||q.get('error_description')||''};
}
const rec=recovery();
if(rec.error||rec.type!=='recovery'||!rec.token){form.hidden=true;status(rec.description?decodeURIComponent(rec.description.replace(/\+/g,' ')):'This password reset link is invalid or expired. Return to Athlete Sign In and request a new one.',true)}
save.onclick=async()=>{
 const a=document.getElementById('password').value,b=document.getElementById('confirm').value;
 if(a.length<8)return status('Use at least 8 characters for your new password.',true);
 if(a!==b)return status('The passwords do not match.',true);
 save.disabled=true;status('Saving your new password…');
 try{
  const r=await fetch(SUPABASE_URL+'/auth/v1/user',{method:'PUT',headers:{'Content-Type':'application/json','apikey':SUPABASE_KEY,'Authorization':'Bearer '+rec.token},body:JSON.stringify({password:a})});
  const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.msg||d.error_description||d.error||'Could not update password');
  try{await fetch(SUPABASE_URL+'/auth/v1/logout',{method:'POST',headers:{apikey:SUPABASE_KEY,Authorization:'Bearer '+rec.token}})}catch(_){}
  history.replaceState({},document.title,location.pathname);form.hidden=true;
  status('Password updated successfully. You can now sign in with your new password.');
 }catch(e){status(e.message||'This reset link may be expired. Request a new password reset email.',true);save.disabled=false}
};
</script>
</body></html>

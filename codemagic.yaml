workflows:
  ios-compile-check:
    name: MW Dynasty iOS V3.0.16 Compile Check
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: latest
    scripts:
      - name: Unpack MW Dynasty iOS base project
        script: |
          set -e
          rm -rf "$CM_BUILD_DIR/ios_build"
          mkdir -p "$CM_BUILD_DIR/ios_build"
          unzip -q "$CM_BUILD_DIR/MW_Dynasty_iOS_V3_0_13_Codemagic_Source.zip" -d "$CM_BUILD_DIR/ios_build"
      - name: Apply MW Dynasty V3.0.16 native patches
        script: |
          set -e
          cp "$CM_BUILD_DIR/ios_v3_0_16_patch/Config/Debug.xcconfig" "$CM_BUILD_DIR/ios_build/Config/Debug.xcconfig"
          cp "$CM_BUILD_DIR/ios_v3_0_16_patch/Config/Release.xcconfig" "$CM_BUILD_DIR/ios_build/Config/Release.xcconfig"
          cp "$CM_BUILD_DIR/ios_v3_0_16_patch/MWDynasty.xcodeproj/project.pbxproj" "$CM_BUILD_DIR/ios_build/MWDynasty.xcodeproj/project.pbxproj"
          cp "$CM_BUILD_DIR/ios_v3_0_16_patch/MWDynasty/WebViewController.swift" "$CM_BUILD_DIR/ios_build/MWDynasty/WebViewController.swift"
          grep -q 'MARKETING_VERSION = 3.0.16' "$CM_BUILD_DIR/ios_build/Config/Release.xcconfig"
          grep -q 'CURRENT_PROJECT_VERSION = 7' "$CM_BUILD_DIR/ios_build/Config/Release.xcconfig"
      - name: Show Xcode version
        script: xcodebuild -version
      - name: Compile MW Dynasty for iOS Simulator
        script: |
          set -o pipefail
          xcodebuild \
            -project "$CM_BUILD_DIR/ios_build/MWDynasty.xcodeproj" \
            -scheme MWDynasty \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            clean build
    artifacts:
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/Products/Debug-iphonesimulator/*.app

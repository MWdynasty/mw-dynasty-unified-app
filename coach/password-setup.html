<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="referrer" content="no-referrer"><meta name="robots" content="noindex,nofollow"><title>Create Coach Password · MW Dynasty</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100svh;background:radial-gradient(ellipse at top,#10283a,#03090f 65%);color:#fff;font-family:system-ui,-apple-system,sans-serif;display:grid;place-items:center;padding:28px 20px}main{width:100%;max-width:440px}header{display:flex;align-items:center;gap:16px;margin-bottom:28px}header img{width:76px;height:76px;border-radius:20px}header b{font-size:24px}header small{display:block;color:#e7c571;letter-spacing:2px;font-size:10px;margin-top:7px}.card{border:1px solid #8b713d;border-radius:24px;padding:28px;background:#091722}h1{font-size:29px;margin:10px 0}p{color:#bdc6ce;line-height:1.5}label{display:block;font-weight:700;margin-top:22px}input{width:100%;margin-top:9px;padding:16px;border:1px solid #657582;border-radius:12px;background:#030b12;color:white;font:inherit;font-size:16px}button{width:100%;border:0;border-radius:12px;padding:18px;margin-top:24px;background:linear-gradient(110deg,#d5a52f,#ffe39a);color:#08111a;font:inherit;font-weight:800;cursor:pointer}button:disabled{opacity:.6;cursor:wait}a{color:#f0ca70}#status{margin:16px 0 0;line-height:1.5}#status[data-error=true]{color:#ffb5a7}.kicker{color:#edc96d;font-size:12px;font-weight:800;letter-spacing:2px}[hidden]{display:none!important}
</style></head><body><main><header><img src="/mw-dynasty-app-icon-512.png" alt="MW Dynasty crest"><div><b>MW DYNASTY</b><small>BUILT FOR YOUR NEXT LEVEL</small></div></header><section class="card"><div class="kicker">COACH ACCOUNT SETUP</div><h1>Create your password</h1><p id="intro">Choose a password to finish setting up your Coach account.</p><form id="setup"><label for="password">New password</label><input id="password" type="password" autocomplete="new-password" minlength="8" placeholder="At least 8 characters" required><label for="confirm">Confirm password</label><input id="confirm" type="password" autocomplete="new-password" minlength="8" required><button id="save" type="submit">Save password</button></form><p id="status" role="status" aria-live="polite"></p><p id="continue" hidden><a href="/coach">Continue to Coach sign in →</a></p><p id="retry" hidden><a href="/coach">Go to Coach sign in</a>, enter your email, then select <b>Forgot password?</b> to request a fresh link.</p></section></main>
<script>
(()=>{
  'use strict';
  const base='https://keqgunlfwhjgcsurynef.supabase.co/auth/v1';
  const key='sb_publishable_JWCLQzrdWA_ZmvbpV5urVg_rcT6NECm';
  const params=new URLSearchParams(location.search);
  let token=params.get('token_hash')||'',session=null;
  history.replaceState({},document.title,location.pathname);
  const form=document.getElementById('setup'),status=document.getElementById('status'),save=document.getElementById('save');
  const say=(text,error=false)=>{status.textContent=text;status.dataset.error=String(error)};
  if(!token){form.hidden=true;say('This setup link is missing or has already been opened. Request a fresh password link.',true);document.getElementById('retry').hidden=false;return}
  async function request(path,method,body,accessToken){
    const headers={apikey:key,'Content-Type':'application/json'};
    if(accessToken)headers.Authorization='Bearer '+accessToken;
    const response=await fetch(base+path,{method,headers,body:JSON.stringify(body),cache:'no-store',referrerPolicy:'no-referrer'});
    const data=await response.json().catch(()=>({}));
    if(!response.ok)throw new Error(data.msg||data.message||data.error_description||'Unable to complete password setup.');
    return data;
  }
  form.onsubmit=async event=>{
    event.preventDefault();
    const password=document.getElementById('password').value,confirm=document.getElementById('confirm').value;
    if(password.length<8)return say('Use at least 8 characters.',true);
    if(password!==confirm)return say('The passwords do not match.',true);
    save.disabled=true;say('Saving your password…');
    try{
      if(!session){
        session=await request('/verify','POST',{token_hash:token,type:'recovery'});
        if(!session.access_token)throw new Error('This link could not be verified. Request a fresh password link.');
        token='';
      }
      await request('/user','PUT',{password},session.access_token);
      // End only the setup session; normal sign-in uses the password the coach chose.
      await fetch(base+'/logout?scope=local',{method:'POST',headers:{apikey:key,Authorization:'Bearer '+session.access_token},referrerPolicy:'no-referrer'}).catch(()=>{});
      session=null;form.reset();form.hidden=true;document.getElementById('intro').textContent='Your password is ready.';
      say('Password saved. You can now sign in with your email and new password.');document.getElementById('continue').hidden=false;
    }catch(error){say(error.message||'Connection interrupted. Try saving again.',true);document.getElementById('retry').hidden=false;save.disabled=false}
  };
})();
</script></body></html>
